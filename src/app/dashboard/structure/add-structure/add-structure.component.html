<div class="content">
  <xng-breadcrumb>
    <ng-container
      *xngBreadcrumbItem="let breadcrumb; let info = info"
    >
    <mat-icon *ngIf="info">{{ info }}</mat-icon>
      <ng-container >{{ breadcrumb }}</ng-container>
    </ng-container>
  </xng-breadcrumb>
  <mat-card class="add-site-card">
    <mat-card-header>
      <mat-card-title>
        {{ "structureContent.addSite.addNewSite" | translate }}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="description">
        {{ "structureContent.addSite.description" | translate }}
      </p>
      <form [formGroup]="addSiteForm">
        <mat-form-field [floatLabel]="'auto'">
          <mat-label>
            {{ "structureContent.addSite.organisation" | translate }}</mat-label
          >
          <input type="text" matInput formControlName="organisation" />
        </mat-form-field>
      </form>
      <button
        (click)="addNewSite()"
        class="add-btn"
        mat-stroked-button
        color="primary"
      >
        {{ "structureContent.addSite.add" | translate }}
      </button>
    </mat-card-content>
    <mat-card-actions> </mat-card-actions>
  </mat-card>
</div>
