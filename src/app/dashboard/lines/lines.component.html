<div class="content">
  <xng-breadcrumb>
    <ng-container *xngBreadcrumbItem="let breadcrumb; let info = info">
      <mat-icon *ngIf="info">{{ info }}</mat-icon>
      <ng-container>{{ breadcrumb }}</ng-container>
    </ng-container>
  </xng-breadcrumb>
  <div class="buttons-right">
    <button 
    (click)="addNewLine()"
    color="primary" mat-raised-button>
      {{ "linesContent.addLine" | translate }}
    </button>
    <button color="primary" mat-raised-button (click)="downloadTemplate()">
      {{ "linesContent.uploadTemplate" | translate }}
    </button>
  </div>
  <div class="search-input">
    <div class="icon-input">
      <mat-icon>search</mat-icon>
      <input
        type="text"
        placeholder="{{ 'plantContent.search' | translate }}"
        (keyup)="searchByPlantOrSite($event)"
      />
    </div>
  </div>
  <div class="filters">
    <select id="site">
      <option selected disabled>{{ "linesContent.site" | translate }}</option>
      <option>Sousse</option>
      <option>Mateur Sud</option>
      <option>Manzel Hayet</option>
    </select>
    <select id="plant">
      <option selected disabled>{{ "linesContent.plant" | translate }}</option>
      <option>BMW</option>
      <option>AUDI</option>
      <option>MS1</option>
      <option>MN1</option>
      <option>MH1</option>
    </select>
    <select id="segment">
      <option selected disabled>
        {{ "linesContent.segment" | translate }}
      </option>
      <option>Cutting & WPA MEB AUTARK</option>
      <option>Segment 45</option>
      <option>Segment 59</option>
      <option>Segment 53-1</option>
      <option>Cutting & WPA SYSAPP LTN1</option>
      <option>Segment Muster SYSAPP</option>
    </select>
  </div>
  <common-table
  [isEvenRowsChangeColor]="true"
  [isShowPaginator]="true"
    [dataSource]="dataSource"
    [tableColumns]="linesColumns"
    [editDeleteActions]="true"
    (action)="onTableAction($event)"
    class="mat-elevation-z8"
  ></common-table>
</div>
