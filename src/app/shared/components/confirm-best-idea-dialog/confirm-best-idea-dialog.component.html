<div class="confirm-best-kaizen-card-dialog">
    <fa-icon (click)="closeDialog()" [icon]="close"></fa-icon>

  <h1 class="message">
    {{
      "ideasContent.bestIdeaSelectionContent.bestIdeaSelectionDialogText"
        | translate
    }}
  </h1>

  <button
    color="primary"
    [mtBasicSpinner]="isLoading"
    [class.spinner]="isLoading"
    mat-raised-button
    (click)="confirmBestIdeaSelection()"
  >
    {{ "ideasContent.bestIdeaSelectionContent.yes" | translate }}
  </button>
</div>
