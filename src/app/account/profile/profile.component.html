<div class="breadcrumb-item">
  <xng-breadcrumb>
    <ng-container
      *xngBreadcrumbItem="let breadcrumb; let info = info"
    >
    <mat-icon *ngIf="info">{{ info }}</mat-icon>
      <ng-container >{{ breadcrumb | translate}}</ng-container>
    </ng-container>
  </xng-breadcrumb>
</div>
<div class="content">
  <mat-card>
    <mat-card-header>
      <mat-card-title>
        {{ "profileForm.profile" | translate }}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <form [formGroup]="profileForm">
        <div class="name-prenom-section">
          <mat-form-field [floatLabel]="'auto'">
            <mat-label>{{ "profileForm.firstName" | translate }}</mat-label>
            <input type="text" matInput formControlName="firstName" />
          </mat-form-field>
          <mat-form-field [floatLabel]="'auto'">
            <mat-label>{{ "profileForm.lastName" | translate }}</mat-label>
            <input type="text" matInput formControlName="lastName" />
          </mat-form-field>
        </div>
        <mat-form-field [floatLabel]="'auto'">
          <mat-label>{{ "profileForm.email" | translate }}</mat-label>
          <input type="email" matInput formControlName="email" />
        </mat-form-field>
        <mat-form-field [floatLabel]="'auto'">
          <mat-label>{{ "profileForm.login" | translate }}</mat-label>
          <input type="text" matInput formControlName="login" />
        </mat-form-field>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button class="save-btn" mat-stroked-button color="primary"
      (click)="saveChanges()"
      >
        {{ "profileForm.save" | translate }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
