<div class="breadcrumb-item">
  <xng-breadcrumb>
    <ng-container
      *xngBreadcrumbItem="let breadcrumb; let info = info"
    >
    <mat-icon *ngIf="info">{{ info }}</mat-icon>
      <ng-container >{{ breadcrumb | translate}}</ng-container>
    </ng-container>
  </xng-breadcrumb>
</div>

<div class="content">

  <mat-card class="settings-card">
    <mat-card-header>
      <mat-card-title>
        {{ "settingsForm.settings" | translate }}
      </mat-card-title>
    </mat-card-header>
    <mat-card-content>
        <div class="left-section">
            <form [formGroup]="passwordForm">
                <mat-form-field  [floatLabel]="'auto'">
                  <mat-label>{{ "settingsForm.password" | translate }}</mat-label>
                  <input type="password" matInput formControlName="password" />
                </mat-form-field>
                <mat-form-field  [floatLabel]="'auto'">
                  <mat-label>{{ "settingsForm.newPassword" | translate }}</mat-label>
                  <input type="password" matInput formControlName="newPassword" />
                </mat-form-field>
                <mat-form-field  [floatLabel]="'auto'">
                  <mat-label>{{ "settingsForm.confirmNewPassword" | translate }}</mat-label>
                  <input type="password" matInput formControlName="confirmNewPassword"/>
                </mat-form-field>
              </form>
              <button 
              (click)="changePassword()"
              class="save-btn" mat-stroked-button color="primary">
                {{ "settingsForm.save" | translate }}
              </button>
        </div>
        <div class="right-section">
            <form [formGroup]="emailForm">
                <mat-form-field  [floatLabel]="'auto'">
                    <mat-label>{{ "settingsForm.modifyEmail" | translate }}</mat-label>
                    <input type="email" matInput formControlName="email"/>
                  </mat-form-field>
             </form>
             <button class="save-btn" 
             (click)="changeEmail()"
             mat-stroked-button color="primary">
                {{ "settingsForm.save" | translate }}
              </button>
        </div>
    </mat-card-content>
    <mat-card-actions>

    </mat-card-actions>
  </mat-card>
</div>
