<div class="content">
  <div class="header-section">
    <img src="/assets/images/Logo-CIP-V1.png" />
      <p class="welcome-employee">
        {{welcomeMessage}}
      </p>
  </div>

  <mat-card>
    <mat-card-title>Bienvenue</mat-card-title>
    <mat-card-content>
      <form [formGroup]="IdeaForm">
        <div class="ideas-labels">
          <mat-label class="enter-idea-fr">{{ "loginContent.enterYourIdea" | translate }}</mat-label>
          <mat-label class="enter-idea-ar">{{
            "loginContent.enterYourIdeaAR" | translate
          }}</mat-label>
        </div>
          <textarea matInput 
          placeholder="Tapez quelques choses"
          cols="30"
          rows="10"
          [formControlName]="'idea'"></textarea>
        <div class="select-superior-items">
            <mat-label class="select-superior-fr">
                {{ "loginContent.selectYourSuperior" | translate }}
              </mat-label>
                <mat-select [formControlName]="'superior'"
                 placeholder="{{ 'loginContent.none' | translate }}"
                 >
                  <mat-option 
                  [value]="res"
                  *ngFor="let res of responsables"
                  >{{res.fullName}}</mat-option>
                </mat-select>
              <mat-label class="select-superior-ar">
                {{ "loginContent.selectYourSuperiorAR" | translate }}
              </mat-label>
        </div>
      </form>
    </mat-card-content>
    <mat-card-actions>
      <button mat-raised-button color="primary"
      [class.spinner]="isLoading"
      [mtBasicSpinner]="isLoading" 

      (click)="saveIdea()"
      >
        {{ "loginContent.save" | translate }} /
        {{ "loginContent.saveAR" | translate }}
      </button>
    </mat-card-actions>
  </mat-card>
</div>
